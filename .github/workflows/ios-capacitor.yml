name: Capacitor iOS project check

on:
  workflow_dispatch:
  push:
    paths:
      - "web/**"
      - "package.json"
      - "capacitor.config.ts"
      - ".github/workflows/ios-capacitor.yml"
  pull_request:
    paths:
      - "web/**"
      - "package.json"
      - "capacitor.config.ts"
      - ".github/workflows/ios-capacitor.yml"

jobs:
  ios-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Generate iOS project
        run: npx cap add ios
      - name: Sync web assets
        run: npx cap sync ios
      - name: Validate native project
        run: test -f ios/App/App.xcodeproj/project.pbxproj
      - name: Package Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: football-iphone-xcode-project
          path: ios/
          if-no-files-found: error
