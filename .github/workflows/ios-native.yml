name: iPhone Native Build Check

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - "package.json"
      - "capacitor.config.ts"
      - ".github/workflows/ios-native.yml"

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Generate iOS project
        run: npx cap add ios
      - name: Sync web assets
        run: npx cap sync ios
      - name: Validate Xcode project
        run: |
          test -f ios/App/App.xcodeproj/project.pbxproj
          test -f ios/App/App/Info.plist
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned iOS project
        run: ditto -c -k --sequesterRsrc --keepParent ios ios-project.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-project
          path: ios-project.zip
          retention-days: 14
