name: Web Smoke Check

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  web-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate the exact bundle loaded by the page
        run: |
          test -f web/index.html
          test -f web/src/game-hardreset.js
          node --check web/src/game-hardreset.js
          grep -q 'game-hardreset.js' web/index.html
          grep -q 'new THREE.WebGLRenderer' web/src/game-hardreset.js
          grep -q 'buildPitch' web/src/game-hardreset.js
          grep -q 'updateBroadcastCamera' web/src/game-hardreset.js
          grep -q 'passOrShoot' web/src/game-hardreset.js
          grep -q 'pointerdown' web/src/game-hardreset.js
          grep -q 'id="stick"' web/index.html
          if grep -q 'id="actions"' web/index.html; then exit 1; fi
          if grep -q 'data-action=' web/index.html; then exit 1; fi
          node -e "const fs=require('fs'); const s=fs.readFileSync('web/src/game-hardreset.js','utf8'); if((s.match(/function buildPitch/g)||[]).length!==1) throw new Error('duplicate buildPitch'); if((s.match(/function updateBroadcastCamera/g)||[]).length!==1) throw new Error('duplicate camera'); console.log('Exact bundle invariants passed.')"
