name: Web Smoke Check

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  web-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate web entry points
        run: |
          test -f web/index.html
          test -f web/src/game.js
          test -f web/src/playerProfiles.js
          node --check web/src/game.js
          node --check web/src/playerProfiles.js
          grep -q 'type="module"' web/index.html
          grep -q 'src="./src/game.js"' web/index.html
          echo "Web smoke checks passed."
