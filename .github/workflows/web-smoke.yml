name: Web Smoke Check

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  web-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate web entry points
        run: |
          test -f web/index.html
          test -f web/src/game.js
          test -f web/src/playerProfiles.js
          node --check web/src/game.js
          node --check web/src/playerProfiles.js
          grep -q 'type="module"' web/index.html
          grep -q 'src="./src/game.js"' web/index.html
          grep -q 'data-action="pass"' web/index.html
          grep -q 'data-action="shoot"' web/index.html
          grep -q 'data-action="tackle"' web/index.html
          grep -q 'id="radar"' web/index.html
          node <<'NODE'
          const fs=require("fs");
          const s=fs.readFileSync("web/src/game.js","utf8");
          const required=[
            ["kickoff gate",/state\.firstKickoff=false;state\.userTouched=true;state\.aiEnabled=true/],
            ["tactical AI",/function tacticalTarget\(/],
            ["goal direction gate",/towardAway=.*towardHome/],
            ["goal height gate",/ball\.position\.y<3\.55&&Math\.abs\(ball\.position\.z\)<7/],
            ["rigged animation",/THREE\.AnimationMixer/],
            ["two-legged rig",/thigh_l.*thigh_r/s],
            ["ball possession",/function stealBall\(/],
            ["audio",/function sfxGoal\(/],
            ["mobile joystick y-axis",/Number\(state\.joy\.y\)/],
            ["true lob arc",/vy=kind==="lob"\?\(6\.5\+6\.5\*charge\)/],
            ["sprint preserved",/state\.actions\.sprint/],
            ["core AI kick function",/function kickTo\(tx,tz,power\)/],
            ["input-only enhancement",/actions=runEnhancedActions;/]
          ];
          for(const [name,re] of required) if(!re.test(s)) throw new Error("Missing gameplay invariant: "+name);
          if((s.match(/function updateRadar/g)||[]).length!==1) throw new Error("Duplicate radar updater");
          if((s.match(/function addStadiumAtmosphere/g)||[]).length!==1) throw new Error("Duplicate stadium initializer");
          if((s.match(/function kickTo\(/g)||[]).length!==1) throw new Error("Duplicate kickTo implementation");
          if((s.match(/function stealBall\(/g)||[]).length!==1) throw new Error("Duplicate stealBall implementation");
          if(!s.includes("ball.userData.vx=ball.userData.vz=ball.userData.vy=0")) throw new Error("Kickoff ball velocity reset missing");
          console.log("Gameplay invariants passed.");
          console.log("Gameplay invariants passed.");
          NODE
          echo "Web smoke checks passed."
