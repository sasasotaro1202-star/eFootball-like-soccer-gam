name: Web CI

on:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:

jobs:
  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate web runtime syntax
        run: npm run web:check

      - name: Run deterministic web gameplay smoke
        run: npm run web:smoke

      - name: Validate canonical entrypoint
        run: |
          test -f web/index.html
          grep -q 'src/home.js' web/index.html
          grep -q 'src/game-hardreset.js' web/index.html
          ! grep -R '|| true' .github/workflows
