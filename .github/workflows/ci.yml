name: Godot CI

on:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:

jobs:
  project-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate project files
        run: |
          test -f project.godot
          test -f Main.tscn
          test -f main.gd
          grep -q 'run/main_scene="res://Main.tscn"' project.godot
          grep -q 'extends Node2D' main.gd
          echo "Project smoke checks passed."
