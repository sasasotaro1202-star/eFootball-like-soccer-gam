<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07131b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FOOTBALL">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>FOOTBALL 3D MATCH</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./style.css?v=hard-reset-20260920-03">
</head>
<body>
<main id="app">
  <div id="game" aria-label="3D soccer game"></div>
  <div id="boot">FOOTBALL<br><small>3D MATCH ENGINE</small></div>

  <header id="matchbar">
    <div class="teamBadge home">H</div><div class="teamName">HOME</div>
    <div class="scoreBlock"><span id="score">0 - 0</span><span id="clock">00:00</span></div>
    <div class="teamName away">AWAY</div><div class="teamBadge away">A</div>
  </header>

  <div id="topTools"><div class="pill"><span class="dot"></span><span id="matchState">LIVE</span></div></div>

  <div id="playerCard">
    <div class="playerCardTop"><span id="playerRole">FW</span><span id="playerNo">#10</span></div>
    <div id="playerLabel">PLAYER 10</div>
    <div class="stamina"><span id="staminaFill"></span></div>
  </div>

  <div id="controls">
    <div id="stick" aria-label="選手移動">
      <div class="stickRing"></div><div id="knob"></div><span class="stickLabel">MOVE</span>
    </div>
  </div>
  <div id="message"></div>
</main>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js"}}
</script>
<script>
window.__gameReady=false;
window.__lastGameError="";
window.addEventListener("error",e=>{window.__lastGameError=String(e?.message||e?.error||"runtime error")});
window.addEventListener("unhandledrejection",e=>{window.__lastGameError=String(e?.reason?.message||e?.reason||"promise rejection")});
</script>
<script type="module" src="./src/game.js?v=hard-reset-20260920-03"></script>
</body>
</html>
