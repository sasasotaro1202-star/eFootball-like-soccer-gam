<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07140d">
<title>3D Soccer</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main id="app">
<div id="game" aria-label="3D soccer game"></div>
<div id="boot" aria-live="polite">3D SOCCER<br><small>Loading match...</small></div>
<div id="hud"><span id="score">0 - 0</span><span id="clock">03:00</span></div>
<div id="controls">
<div id="stick"><div id="knob"></div></div>
<div id="actions">
<button data-action="pass">PASS</button><button data-action="shoot">SHOOT</button>
<button data-action="tackle">TACKLE</button><button data-action="switch">SWITCH</button>
<button data-action="sprint">SPRINT</button>
</div>
</div>
<div id="message"></div>
<canvas id="fallback" aria-label="fallback soccer match"></canvas>
</main>
<script>
window.__gameModuleLoaded=false;
window.addEventListener("error",function(e){
  if(window.__gameModuleLoaded)return;
  var cv=document.getElementById("fallback"),ctx=cv.getContext("2d"),dpr=Math.min(devicePixelRatio||1,2);
  function resize(){cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;cv.style.width="100%";cv.style.height="100%";ctx.setTransform(dpr,0,0,dpr,0,0)}
  function draw(){var w=innerWidth,h=innerHeight;ctx.clearRect(0,0,w,h);ctx.fillStyle="#0b301b";ctx.fillRect(0,0,w,h);var m=Math.min(w*.05,h*.08),pw=w-2*m,ph=Math.min(h*.72,pw*.64);var x=m,y=(h-ph)/2;ctx.fillStyle="#176b38";ctx.fillRect(x,y,pw,ph);ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.strokeRect(x,y,pw,ph);ctx.beginPath();ctx.moveTo(x+pw/2,y);ctx.lineTo(x+pw/2,y+ph);ctx.stroke();ctx.beginPath();ctx.arc(x+pw/2,y+ph/2,ph*.14,0,Math.PI*2);ctx.stroke();
    function p(px,py,c,n){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x+px*pw,y+py*ph,Math.max(9,ph*.022),0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff";ctx.font="bold 10px system-ui";ctx.textAlign="center";ctx.fillText(n,x+px*pw,y+py*ph+3)}
    for(var i=0;i<11;i++){p(.08+(i%4)*.16,.14+Math.floor(i/4)*.36,i===0?"#287cf0":"#2f78d0",i+1);p(.92-(i%4)*.16,.14+Math.floor(i/4)*.36,"#d93445",i+1)}p(.5,.5,"#fff","");ctx.fillStyle="#fff";ctx.font="900 28px system-ui";ctx.textAlign="center";ctx.fillText("3D SOCCER",w/2,Math.max(42,y-18));ctx.font="700 13px system-ui";ctx.fillText("3D engine loading / fallback view",w/2,y+ph+28)}
  cv.style.display="block";resize();draw();addEventListener("resize",function(){resize();draw()});var b=document.getElementById("boot");if(b){b.classList.remove("ready");b.innerHTML="3D ENGINE ERROR<br><small>Fallback match view is active</small>"}
});
</script>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
</script>
<script type="module" src="./src/game.js"></script>
</body>
</html>
